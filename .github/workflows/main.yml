name: Angelica Ultimate Auto-Repair Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: AI Smart Patching (Fix Everything)
        run: |
          echo "--- Bắt đầu chế độ Tự sửa lỗi thông minh ---"
          
          # 1. Sửa lỗi DrvGen.py (Python 3 Compatibility)
          # Tự động thêm ngoặc đơn cho lệnh print và sửa các cấu trúc Python 2 cũ
          find . -name "*.py" -type f -exec sed -i 's/print >> \([^,]*\), \(.*\)/print((\2), file=\1)/g' {} +
          find . -name "*.py" -type f -exec sed -i 's/print \(.*\)/print(\1)/g' {} +
          
          # 2. Fix lỗi "duplicate definition" của YYLLOC trong các file parser (thường gặp trên Ubuntu 22)
          find . -name "*.c" -o -name "*.h" -o -name "*.l" | xargs sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' || true

          # 3. Fix lỗi Stack Protector (Lỗi compiler không hỗ trợ STRONG)
          CONFIG_FILE="arch/arm64/configs/angelica_defconfig"
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_REGULAR=y/g' $CONFIG_FILE

          # 4. Tự động chèn trọn bộ cấu hình Docker (Hệ thống tự động kiểm tra trùng lặp)
          DOCKER_CONFIGS=(
            "CONFIG_NAMESPACES" "CONFIG_NET_NS" "CONFIG_PID_NS" "CONFIG_IPC_NS" "CONFIG_UTS_NS"
            "CONFIG_CGROUPS" "CONFIG_CGROUP_DEVICE" "CONFIG_CGROUP_FREEZER" "CONFIG_CGROUP_CPUACCT"
            "CONFIG_MEMCG" "CONFIG_MEMCG_SWAP" "CONFIG_VETH" "CONFIG_BRIDGE" "CONFIG_OVERLAY_FS"
            "CONFIG_IP_NF_TARGET_MASQUERADE" "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE"
          )

          for cfg in "${DOCKER_CONFIGS[@]}"; do
            if grep -q "$cfg" "$CONFIG_FILE"; then
                sed -i "s/.*$cfg=.*/$cfg=y/" "$CONFIG_FILE"
            else
                echo "$cfg=y" >> "$CONFIG_FILE"
            fi
          done
          
          echo "--- AI đã dọn dẹp xong mã nguồn! ---"

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Force build dùng python3 sau khi đã patch xong
          export PYTHON=python3
          
          make O=out clean && make O=out mrproper
          make O=out angelica_defconfig
          make -j$(nproc --all) O=out

      - name: Finalize & Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          # Lấy file kernel (Angelica thường dùng Image.gz-dtb)
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          cd anykernel
          sed -i 's/device.name1=maguro/device.name1=angelica/' anykernel.sh
          zip -r9 ../Angelica-AutoFix-Docker.zip *

      - name: Upload Build
        uses: actions/upload-artifact
