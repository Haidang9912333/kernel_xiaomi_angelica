name: Build Angelica Kernel - Ultimate Docker Support
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Compiler (GCC 10)
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Advanced Kernel Patching (Docker & Security)
        run: |
          CONFIG_FILE=arch/arm64/configs/angelica_defconfig
          
          # 1. Sửa lỗi Stack Protector (Nguyên nhân gây sập build của bạn)
          # Chuyển sang REGULAR thay vì STRONG để tương thích hoàn toàn với GCC hệ thống
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_REGULAR=y/g' $CONFIG_FILE

          # 2. Inject cấu hình Docker "Hardcore" 
          # Mình thêm cả OverlayFS và BPF để Docker chạy mượt như máy tính
          cat <<EOF >> $CONFIG_FILE
          # --- DOCKER CORE REQUIREMENTS ---
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_OVERLAY_FS=y
          
          # --- DOCKER NETWORKING (NAT & PORT FORWARDING) ---
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_VS=y
          
          # --- OPTIONAL BUT RECOMMENDED ---
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CGROUP_WRITEBACK=y
          EOF
          
          echo "Vá lỗi thành công. Đã cấu hình 18 tham số hỗ trợ Docker."

      - name: Professional Build Process
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Sử dụng thư mục build riêng để bảo vệ mã nguồn
          make O=out clean && make O=out mrproper
          make O=out angelica_defconfig
          
          # Build với toàn bộ sức mạnh CPU của GitHub Runner
          make -j$(nproc --all) O=out

      - name: Packaging with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          
          # Xác định file output (Angelica thường dùng Image.gz-dtb)
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          
          cd anykernel
          # Patch cho đúng mã máy Redmi 9C
          sed -i 's/device.name1=maguro/device.name1=angelica/' anykernel.sh
          zip -r9 ../Angelica-Ultimate-Docker.zip *

      - name: Export Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Angelica-Kernel-Ultimate
          path: Angelica-Ultimate-Docker.zip
