name: Build Angelica Docker-Ready Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang llvm lld

      - name: Clone Toolchain & AnyKernel3
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

      - name: Patch Docker Configs
        run: |
          CONFIG_FILE=arch/arm64/configs/angelica_defconfig
          cat <<EOF >> $CONFIG_FILE
          # Docker Requirements
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_KEYS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_VS=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out angelica_defconfig
          make -j$(nproc --all) O=out CC=clang LLVM=1 LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          # Chỉnh sửa thiết bị mục tiêu cho AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=angelica/' anykernel.sh
          zip -r9 ../Angelica-Docker-Kernel.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Angelica-Docker-Kernel-Flashable
          path: Angelica-Docker-Kernel.zip
